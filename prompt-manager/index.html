<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プロンプト管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>プロンプト管理</h1>
    <p class="subtitle">プロンプトを登録して、カンマ区切りの1つの文章にまとめます</p>
  </header>

  <main class="layout">
    <!-- プロンプト一覧 -->
    <section class="card">
      <h2>プロンプト</h2>
      <form id="add-form" class="add-form">
        <input id="add-input" type="text" placeholder="プロンプトを入力（例: masterpiece）" autocomplete="off" required>
        <button type="submit" class="btn primary">追加</button>
      </form>
      <p class="hint">カンマ区切りで入力すると複数まとめて追加できます。</p>

      <div class="list-toolbar">
        <span id="count" class="muted"></span>
        <div class="toolbar-actions">
          <button id="check-all" class="btn small">全選択</button>
          <button id="uncheck-all" class="btn small">全解除</button>
          <button id="clear-all" class="btn small danger">全削除</button>
        </div>
      </div>

      <ul id="prompt-list" class="prompt-list"></ul>
      <p id="empty" class="empty">まだプロンプトがありません。上の入力欄から追加してください。</p>
    </section>

    <!-- 結合結果 -->
    <section class="card">
      <h2>結合結果</h2>
      <div class="sep-row">
        <label for="separator">区切り文字</label>
        <select id="separator">
          <option value=", ">カンマ＋スペース（, ）</option>
          <option value=",">カンマのみ（,）</option>
          <option value="、">読点（、）</option>
        </select>
      </div>
      <textarea id="output" rows="6" readonly placeholder="チェックしたプロンプトがここに結合されます"></textarea>
      <div class="output-actions">
        <button id="copy" class="btn primary">コピー</button>
        <span id="copy-status" class="muted" role="status"></span>
      </div>

      <h2 class="mt">セットとして保存</h2>
      <form id="preset-form" class="add-form">
        <input id="preset-name" type="text" placeholder="セット名（例: 風景用）" autocomplete="off" required>
        <button type="submit" class="btn">保存</button>
      </form>
      <ul id="preset-list" class="preset-list"></ul>
      <p id="preset-empty" class="empty">保存済みのセットはありません。</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
